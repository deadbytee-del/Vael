<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c13">
<title>Vael</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c13;--bg2:#17131f;--bg3:#1e1829;--panel:#15111d;--line:#2a2436;--primary:#3c2f51;--primary-l:#5b4a7a;--primary-d:#241c33;--text:#e8e3f0;--dim:#8b8299;--dim2:#635a72;--ok:#6fae8f;--warn:#c9a227;--danger:#b25b62;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.25,.8,.35,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;transition:background .2s}
::-webkit-scrollbar-thumb:hover{background:var(--primary-l)}
::-webkit-scrollbar-track{background:transparent}
.shell{display:flex;flex-direction:column;height:100vh}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:15}
.tb-left{display:flex;align-items:center;gap:12px;flex:none}
.topbrand{font-weight:700;font-size:15px;letter-spacing:-.01em;font-family:var(--mono)}
.topstatus{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);background:var(--bg3);padding:4px 10px;border-radius:20px}
.tled{width:7px;height:7px;border-radius:50%;background:var(--dim2);transition:background .3s}
.tled.on{background:var(--ok)}
.tled.warn{background:var(--warn);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.tb-search{position:relative;flex:1;max-width:420px}
.tb-search input{width:100%;background:var(--bg3);border:1.5px solid transparent;border-radius:20px;padding:8px 14px 8px 36px;font-size:13.5px;outline:0;transition:border-color .18s,background .18s}
.tb-search input:focus{border-color:var(--primary-l);background:var(--bg2)}
.tb-search>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim);pointer-events:none}
.searchpanel{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(0,0,0,.5);max-height:340px;overflow-y:auto;z-index:30}
.searchresult{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.searchresult:last-child{border-bottom:0}
.searchresult:hover{background:var(--bg3)}
.searchresult b{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.searchresult small{font-size:13.5px;color:var(--text)}
.searchempty{padding:16px;text-align:center;color:var(--dim);font-size:13.5px}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.topicon{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s}
.topicon:hover{background:var(--bg3);color:var(--text)}
.topicon svg{width:18px;height:18px}
.nbadge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.notifpanel{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px rgba(0,0,0,.5);max-height:360px;overflow-y:auto;z-index:30}
.notifitem{display:block;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;position:relative;transition:background .15s}
.notifitem:last-child{border-bottom:0}
.notifitem:hover{background:var(--bg3)}
.notifitem b{display:block;font-size:13px;font-weight:600}
.notifitem small{display:block;font-size:12.5px;color:var(--dim);margin-top:1px;padding-right:50px}
.notifitem .ntime{position:absolute;top:10px;right:12px;font-size:11px;color:var(--dim2)}
.topprofile{position:relative}
#profbtn{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:20px;transition:background .15s}
#profbtn:hover{background:var(--bg3)}
#profbtn img{width:26px;height:26px;border-radius:50%;background:var(--bg3);object-fit:cover}
#profbtn span{font-size:13.5px;font-weight:600;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profmenu{position:absolute;top:calc(100% + 8px);right:0;width:170px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 16px 36px rgba(0,0,0,.5);padding:6px;z-index:30}
.profmenu a,.profmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:7px;font-size:13.5px;color:var(--text);text-decoration:none;transition:background .15s}
.profmenu a:hover,.profmenu button:hover{background:var(--bg3)}
.profmenu svg{width:15px;height:15px;color:var(--dim)}
.body3{flex:1;display:flex;min-height:0}
.sidebar{width:250px;flex:none;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.navgroup{padding:12px 8px 4px;animation:rise .3s var(--ease) backwards}
.navgroup:nth-child(2){animation-delay:.03s}
.navgroup:nth-child(3){animation-delay:.06s}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.navgroup h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);padding:6px 10px;font-weight:600}
.navlist{display:flex;flex-direction:column;gap:1px}
.navitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:14px;position:relative;transition:background .16s,color .16s,transform .12s}
.navitem:hover{background:var(--bg3);color:var(--text);transform:translateX(2px)}
.navitem.on{background:var(--primary-d);color:var(--text)}
.navitem.on svg{opacity:1;color:#c9b8e8}
.navitem:active{transform:translateX(2px) scale(.98)}
.navitem svg{width:16px;height:16px;flex:none;opacity:.85;transition:opacity .16s,color .16s}
.navitem .un{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:16px;text-align:center}
.navitem .lock{margin-left:auto;width:13px;height:13px;opacity:.6}
.navitem .av{width:20px;height:20px;border-radius:50%;flex:none;background:var(--bg3);object-fit:cover}
.dmempty{padding:10px 10px;color:var(--dim2);font-size:12.5px;line-height:1.5}
.sidebar-scroll{flex:1;overflow-y:auto;padding-bottom:8px}
.addbtn{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--dim);margin-left:auto;transition:background .15s,color .15s,transform .15s}
.addbtn:hover{background:var(--bg3);color:var(--text);transform:rotate(90deg)}
.navgroup-head{display:flex;align-items:center}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.rightbar{width:220px;flex:none;background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;padding:14px 10px}
.rbgroup{margin-bottom:18px}
.rbgroup h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim2);padding:0 6px 8px;font-weight:600}
.memberrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;position:relative;transition:background .15s}
.memberrow:hover{background:var(--bg3)}
.memberrow img{width:26px;height:26px;border-radius:50%;background:var(--bg3);object-fit:cover}
.memberrow.off img{opacity:.4}
.mdot{position:absolute;left:22px;top:24px;width:8px;height:8px;border-radius:50%;background:var(--dim2);border:2px solid var(--bg2)}
.mdot.on{background:var(--ok)}
.mname{font-size:13.5px;cursor:pointer;transition:color .15s}
.memberrow.off .mname{color:var(--dim)}
.mname:hover{color:#c9b8e8}
.homewrap{flex:1;overflow-y:auto;padding:36px 40px;max-width:760px;animation:fadeIn .25s var(--ease)}
.homehi{font-size:26px;font-weight:700;margin-bottom:6px}
.homesub{color:var(--dim);font-size:14.5px;margin-bottom:22px}
.homestatuscard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:30px}
.hsrow{display:flex;align-items:center;gap:9px;font-size:15px}
.hsrow .led{width:9px;height:9px;border-radius:50%;background:var(--dim2)}
.hsrow .led.on{background:var(--ok)}
.hsrow .led.warn{background:var(--warn)}
.hsmeta{color:var(--dim);font-size:13px;margin-top:6px}
.hometilehead{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim2);margin-bottom:12px;font-weight:600}
.hometiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.hometile{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s,background .15s}
.hometile:hover{transform:translateY(-2px);border-color:var(--primary-l);background:var(--bg3)}
.hometile .ico{width:32px;height:32px;border-radius:9px;background:var(--primary-d);display:grid;place-items:center;color:#c9b8e8}
.hometile .ico svg{width:17px;height:17px}
.hometile b{font-size:14px}
.hometile small{color:var(--dim);font-size:12.5px}
.chead{height:52px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;animation:fadeIn .25s var(--ease)}
.chead b{font-size:15px;font-weight:600}
.chead .d{color:var(--dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .sp{flex:1}
.chead button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s}
.chead button:hover{background:var(--bg3);color:var(--text)}
.chead button svg{width:17px;height:17px}
@keyframes fadeIn{from{opacity:0}}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msgs{flex:1;overflow-y:auto;padding:14px 18px 6px;display:flex;flex-direction:column;gap:2px;animation:fadeIn .25s var(--ease)}
.msg{display:flex;gap:11px;padding:5px 8px;border-radius:8px;position:relative;transition:background .15s;animation:msgIn .28s var(--ease) backwards}
.msg:hover{background:var(--bg2)}
.msg img.av{width:36px;height:36px;border-radius:50%;flex:none;margin-top:2px;background:var(--bg3);object-fit:cover;transition:transform .15s}
img.av[data-profile]:hover{transform:scale(1.08)}
.msg .body{min-width:0;flex:1}
.msg .hd{display:flex;align-items:baseline;gap:8px}
.msg .name{font-weight:600;font-size:14.5px;background:none;border:0;padding:0;color:inherit;cursor:pointer;font-family:inherit;transition:color .15s}
.msg .name:hover{text-decoration:underline;color:#c9b8e8}
.msg .name.staff{color:#b9a4dc}
.msg.pinnedmsg{background:rgba(201,162,39,.06);border-left:2px solid var(--warn)}
.pinbadge{display:inline-flex;align-items:center;gap:3px;color:var(--warn);font-size:11px;font-weight:600}
.pinbadge svg{width:11px;height:11px}
.profpop{position:absolute;z-index:25;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 14px 34px rgba(0,0,0,.5);animation:popIn .16s var(--ease) backwards}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.profpop .ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.profpop .ph img{width:38px;height:38px;border-radius:50%;background:var(--bg3)}
.profpop .ph b{font-size:15px;font-weight:600}
.profpop .stat{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;color:var(--dim)}
.profpop .stat b{color:var(--text);font-weight:600}
.profpop .msgline{color:var(--dim);font-size:13px;text-align:center;padding:6px 0}
.profpop .dmbtn{display:block;width:100%;margin-top:8px;padding:8px;border-radius:8px;background:var(--primary);font-size:13px;font-weight:600;text-align:center;transition:background .15s}
.profpop .dmbtn:hover{background:var(--primary-l)}
.msg .time{color:var(--dim2);font-size:11.5px}
.msg .text{font-size:14.5px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.msg .text code{background:var(--bg3);padding:1px 5px;border-radius:4px;font:13px var(--mono)}
.msg .reply{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;margin-bottom:2px}
.msg .reply svg{width:12px;height:12px}
.msg .reactions{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.reaction{display:flex;align-items:center;gap:4px;background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:2px 8px;font-size:12.5px;transition:background .15s,border-color .15s,transform .1s;animation:popIn .18s var(--ease) backwards}
.reaction.mine{border-color:var(--primary-l);background:var(--primary-d)}
.reaction:hover{background:var(--bg2);transform:translateY(-1px)}
.mactions{position:absolute;top:-14px;right:8px;display:flex;opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;transition:opacity .15s,transform .15s;transform:translateY(3px)}
.msg:hover .mactions{opacity:1;pointer-events:auto;transform:translateY(0)}
.mactions button{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s,transform .1s}
.mactions button:hover{background:var(--bg3);color:var(--text);transform:scale(1.08)}
.mactions button svg{width:14px;height:14px}
.pending{opacity:.55}
.daydiv{display:flex;align-items:center;gap:10px;color:var(--dim2);font-size:11.5px;margin:10px 0}
.daydiv::before,.daydiv::after{content:"";flex:1;height:1px;background:var(--line)}
.empty-chan{margin:auto;text-align:center;color:var(--dim);max-width:280px;animation:fadeIn .3s var(--ease)}
.empty-chan svg{width:36px;height:36px;color:var(--dim2);margin-bottom:10px}
.empty-chan b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.composer{flex:none;padding:12px 16px 16px}
.replybar{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:7px 12px;font-size:12.5px;color:var(--dim);border-bottom:0;animation:rise .18s var(--ease)}
.replybar b{color:var(--text)}
.replybar button{margin-left:auto;color:var(--dim);transition:color .15s}
.replybar button:hover{color:var(--text)}
.cbox{display:flex;align-items:flex-end;gap:8px;background:var(--bg2);border:1.5px solid transparent;border-radius:10px;padding:8px 8px 8px 14px;transition:border-color .18s}
.cbox:focus-within{border-color:var(--primary-l)}
.cbox.top{border-radius:0 0 10px 10px}
.cbox textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;font-size:14.5px;color:var(--text);padding:6px 0}
.cbox textarea::placeholder{color:var(--dim2)}
.cbox button.send{width:34px;height:34px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none;transition:background .15s,transform .1s}
.cbox button.send:hover{background:var(--primary-l);transform:scale(1.05)}
.cbox button.send:active{transform:scale(.94)}
.cbox button.send:disabled{opacity:.4;cursor:default;transform:none}
.cbox button.send svg{width:16px;height:16px}
.muted-line{color:var(--warn);font-size:12.5px;padding:6px 2px 0}
.offline{background:var(--warn);color:#1c1608;text-align:center;font-size:12.5px;font-weight:600;padding:5px}
.gate{flex:1;display:flex;align-items:center;justify-content:center}
.gatebox{width:340px;text-align:center;animation:rise .35s var(--ease) backwards}
.gatebox h1{font-size:21px;font-weight:700;margin-bottom:8px}
.gatebox p{color:var(--dim);font-size:14px;margin-bottom:20px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:9px;font-weight:600;font-size:14.5px;width:100%;transition:background .16s,transform .1s}
.btn.pri{background:var(--primary)}
.btn.pri:hover{background:var(--primary-l);transform:translateY(-1px)}
.btn.pri:active{transform:translateY(0) scale(.98)}
.btn.sec{background:var(--bg3)}
.btn.sec:hover{background:var(--line)}
.btn.dan{background:var(--danger)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.gatebox input{width:100%;text-align:center;letter-spacing:.2em;font:600 18px var(--mono);text-transform:uppercase;background:var(--bg2);border:1.5px solid transparent;border-radius:9px;padding:12px;margin-bottom:12px;outline:0;transition:border-color .18s}
.gatebox input:focus{border-color:var(--primary-l)}
.gerr{color:var(--danger);font-size:13px;margin:-6px 0 12px;animation:rise .2s var(--ease)}
.stack{display:flex;flex-direction:column;gap:10px}
.settings-wrap{flex:1;display:flex;overflow:hidden}
.stabs{width:190px;flex:none;border-right:1px solid var(--line);padding:16px 8px}
.stabs button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;color:var(--dim);font-size:14px;margin-bottom:1px;transition:background .15s,color .15s}
.stabs button.on{background:var(--bg3);color:var(--text)}
.stabs button:hover{color:var(--text)}
.spane{flex:1;overflow-y:auto;padding:26px 32px;max-width:560px;animation:fadeIn .25s var(--ease)}
.spane h2{font-size:19px;font-weight:700;margin-bottom:4px}
.spane .sub{color:var(--dim);font-size:13.5px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--dim);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;background:var(--bg2);border:1.5px solid transparent;border-radius:8px;padding:10px 12px;outline:0;transition:border-color .18s}
.field input:focus,.field textarea:focus{border-color:var(--primary-l)}
.avatarrow{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.avatarrow img{width:64px;height:64px;border-radius:50%;background:var(--bg3);object-fit:cover}
.hr{height:1px;background:var(--line);margin:20px 0}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.toggle b{font-size:14px;font-weight:600}
.toggle small{display:block;color:var(--dim);font-size:12.5px}
.switch{width:38px;height:22px;border-radius:11px;background:var(--bg3);position:relative;flex:none;transition:background .2s}
.switch.on{background:var(--primary)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s var(--ease)}
.switch.on i{transform:translateX(16px)}
.rowitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.rowitem:last-child{border-bottom:0}
.rowitem .rt{flex:1;min-width:0}
.rowitem small{display:block;color:var(--dim);font-size:12px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--bg3);color:var(--dim)}
.tag.ok{color:var(--ok)}
.copytxt{font:12.5px var(--mono);background:var(--bg3);border-radius:6px;padding:8px 10px;word-break:break-all;color:var(--dim);margin-top:6px}
.pickr{position:fixed;inset:0;background:rgba(6,4,10,.55);display:flex;align-items:center;justify-content:center;z-index:30;animation:fadeIn .15s var(--ease)}
.pickbox{width:380px;max-height:70vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;animation:rise .2s var(--ease) backwards}
.pickbox .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.pickbox .ph b{font-size:15px}
.pickbox .ph button{margin-left:auto;color:var(--dim);transition:color .15s;width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px}
.pickbox .ph button svg{width:16px;height:16px}
.pickbox .ph button:hover{color:var(--text);background:var(--bg3)}
.pickbox input{margin:12px 14px 6px;background:var(--bg2);border:1.5px solid transparent;border-radius:8px;padding:8px 10px;outline:0;transition:border-color .18s}
.pickbox input:focus{border-color:var(--primary-l)}
.picklist{overflow-y:auto;padding:6px}
.pickitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;transition:background .15s}
.pickitem:hover{background:var(--bg3)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 16px;font-size:13.5px;z-index:40;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease)}

.hidden{display:none!important}
.fade{animation:fadeIn .12s ease}
.mobiletoggle{display:none;position:fixed;top:60px;left:12px;z-index:22;width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);align-items:center;justify-content:center;color:var(--text)}
.mobiletoggle svg{width:18px;height:18px}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(6,4,10,.5);z-index:19;opacity:0;transition:opacity .2s}

@media(max-width:860px){.mobiletoggle{display:flex}.rightbar{display:none}.tb-left .topbrand{display:none}.tb-search{max-width:none}.sidebar{position:fixed;left:0;top:52px;bottom:0;z-index:20;transform:translateX(-250px);transition:transform .22s var(--ease)}.sidebar.open{transform:none}.stabs{width:150px}.spane{padding:20px}.chead{padding-left:56px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--primary-l);outline-offset:2px}
.spin{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.ticketcard{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;max-width:420px;transition:border-color .18s,background .18s,transform .15s}
.ticketcard:hover{border-color:var(--primary-l);background:var(--bg3);transform:translateY(-2px)}
.ticketcard .ico{width:40px;height:40px;border-radius:11px;background:var(--primary-d);display:grid;place-items:center;color:#c9b8e8;flex:none}
.ticketcard .ico svg{width:20px;height:20px}
.ticketcard b{display:block;font-size:15px}
.ticketcard small{color:var(--dim);font-size:12.5px}
.ticketcard>svg{width:16px;height:16px;color:var(--dim);margin-left:auto;flex:none}
.attachbtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--dim);flex:none;transition:background .15s,color .15s}
.attachbtn:hover{background:var(--bg3);color:var(--text)}
.attachbtn svg{width:17px;height:17px}
#attachpreview:empty{display:none}
.stagedimg{position:relative;display:inline-block;margin:0 0 8px 14px}
.stagedimg img{max-height:90px;border-radius:10px;display:block;border:1px solid var(--line)}
.stagedimg button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.stagedimg button svg{width:12px;height:12px}
.msgattach{display:block;margin-top:6px;max-width:320px}
.msgattach img{max-width:100%;max-height:260px;border-radius:10px;display:block;border:1px solid var(--line);transition:transform .15s}
.msgattach:hover img{transform:scale(1.01)}
.embedbox{margin-top:6px;max-width:360px}
.embedloading{padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--dim);font-size:13px}
.embedcard{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:border-color .18s,transform .15s;animation:popIn .2s var(--ease) backwards}
.embedcard:hover{border-color:var(--primary-l);transform:translateY(-1px)}
.embedcard.row{display:flex;align-items:center;gap:12px;padding:12px}
.embedcard.plain{padding:12px 14px}
.embedthumb{width:100%;max-height:180px;object-fit:cover;display:block}
.embedbody{padding:10px 12px}
.embedcard.row .embedbody{padding:0}
.embedicon{width:38px;height:38px;border-radius:9px;background:var(--primary-d);display:grid;place-items:center;color:#c9b8e8;flex:none;overflow:hidden}
.embedicon img{width:100%;height:100%;object-fit:cover}
.embedicon svg{width:18px;height:18px}
.embedkind{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.embedbody b{display:block;font-size:13.5px;line-height:1.3}
.embedbody small{color:var(--dim);font-size:12px}
.swatches{display:flex;gap:10px}

.segtoggle button.on{background:var(--primary);color:#fff}

body.compact .daydiv{margin:6px 0}

.nbadge{animation:popIn .25s var(--ease) backwards}
.searchpanel:not(.hidden){animation:popIn .15s var(--ease) backwards}
.notifpanel:not(.hidden){animation:popIn .15s var(--ease) backwards}
.profmenu:not(.hidden){animation:popIn .15s var(--ease) backwards}
.rbgroup{animation:rise .3s var(--ease) backwards}
.rbgroup:nth-child(2){animation-delay:.05s}
.memberrow{animation:rise .25s var(--ease) backwards}
.hometile{animation:rise .3s var(--ease) backwards}
.hometile:nth-child(2){animation-delay:.04s}
.hometile:nth-child(3){animation-delay:.08s}
.hometile:nth-child(4){animation-delay:.12s}
.hometile:nth-child(5){animation-delay:.16s}
.homestatuscard{animation:rise .3s var(--ease) backwards}
.embedthumb,.msgattach img{animation:fadeIn .3s var(--ease)}

.vavatar{width:64px;height:64px;border-radius:50%;background:var(--bg3)}

.voicebar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px}

.vbtn:hover{transform:translateY(-1px)}
.vbtn:active{transform:scale(.94)}
.vbtn svg{width:19px;height:19px}
.vbtn.off{background:var(--danger);border-color:var(--danger)}
.vbtn.on{background:var(--primary);border-color:var(--primary)}
.vbtn.leave{background:var(--danger);border-color:var(--danger)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);text-decoration:none;font-size:14px;margin-bottom:14px;transition:color .15s}
.back svg{width:16px;height:16px}
.back:hover{color:var(--text)}

.dock .dn{flex:1}

<script>
const DEFAULT_API_BASE="https://vaelkits.minekeep.dev:2053"
const SERVER_IP="play.vaelkits.net"
const CHANNEL_META={
announcements:{label:"Announcements",desc:"Updates from the staff team.",icon:"megaphone",group:"Server"},
staff:{label:"Staff",desc:"Staff-only discussion.",icon:"shield",group:"Server"},
general:{label:"General",desc:"Talk about anything VaelKits.",icon:"chat",group:"Community"},
"off-topic":{label:"Off Topic",desc:"Memes, banter, anything not VaelKits.",icon:"smile",group:"Community"},
trading:{label:"Trading",desc:"Buy, sell, and trade with other players.",icon:"trade",group:"Community"},
media:{label:"Media",desc:"Share screenshots and clips.",icon:"image",group:"Community"},
"self-promo":{label:"Self Promo",desc:"Share your YouTube, TikTok, Instagram or Discord.",icon:"star",group:"Community"},
help:{label:"Help",desc:"Stuck on something? Ask here.",icon:"help",group:"Support"},
"bug-reports":{label:"Bug Reports",desc:"Found something broken? Report it here.",icon:"bug",group:"Support"},
suggestions:{label:"Suggestions",desc:"Ideas for kits, the shop, the arena.",icon:"idea",group:"Support"}
}
const CHANNEL_GROUP_ORDER=["Server","Community","Support"]
const VOICE_LABELS={general:"General","mc-general":"MC General"}

const db=new Dexie("vael")
db.version(1).stores({
messages:"[channel+id],channel,ts",
outbox:"++localId,channel,ts",
drafts:"channel",
settings:"key",
blocks:"name",
profileCache:"name",
memberCache:"name",
notifs:"++id,ts,read"
})
async function cacheMessages(channel,arr){
if(!arr.length)return
await db.messages.bulkPut(arr.map(m=>({...m,channel})))
}
async function getCachedMessages(channel,limit){
return db.messages.where("channel").equals(channel).sortBy("ts").then(a=>a.slice(-limit))
}
async function latestTs(channel){
const rows=await db.messages.where("channel").equals(channel).sortBy("ts")
return rows.length?rows[rows.length-1].ts:0
}
async function setSetting(key,value){await db.settings.put({key,value})}
async function getSetting(key,fallback){const r=await db.settings.get(key);return r?r.value:fallback}
async function queueOutbox(channel,content,replyTo){
return db.outbox.add({channel,content,replyTo:replyTo||null,ts:Date.now()})
}
async function dropOutbox(localId){return db.outbox.delete(localId)}
async function listOutbox(channel){return db.outbox.where("channel").equals(channel).toArray()}
async function setDraft(channel,text){
if(!text){await db.drafts.delete(channel);return}
await db.drafts.put({channel,text})
}
async function getDraft(channel){const r=await db.drafts.get(channel);return r?r.text:""}
async function isBlocked(name){const r=await db.blocks.get(name.toLowerCase());return !!r}
async function toggleBlock(name){
const low=name.toLowerCase()
const r=await db.blocks.get(low)
if(r){await db.blocks.delete(low);return false}
await db.blocks.put({name:low})
return true}
async function listBlocks(){return db.blocks.toArray()}
async function cacheMembers(names){
await db.memberCache.clear()
await db.memberCache.bulkPut(names.map(name=>({name})))
}
async function getCachedMembers(){
return (await db.memberCache.toArray()).map(r=>r.name)
}
async function pruneLocalMessages(maxAgeDays){
const cutoff=Date.now()-maxAgeDays*86400000
const old=await db.messages.where("ts").below(cutoff).toArray()
const ids=old.filter(m=>!m.pinned).map(m=>[m.channel,m.id])
if(ids.length)await db.messages.bulkDelete(ids)
return ids.length
}
async function searchMessages(text){
const q=text.trim().toLowerCase()
if(!q)return[]
const all=await db.messages.toArray()
return all.filter(m=>m.content&&m.content.toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts).slice(0,50)
}
async function addNotif(n){
return db.notifs.add({...n,read:false})
}
async function unreadNotifCount(){
return db.notifs.where("read").equals(0).count()
}
async function listNotifs(){
return (await db.notifs.orderBy("ts").reverse().limit(30).toArray())
}
async function markNotifsRead(){
const unread=await db.notifs.where("read").equals(0).toArray()
await db.notifs.bulkPut(unread.map(n=>({...n,read:true})))
}

const P2P_PREFIX="vael-p2p-"
function p2pId(name){
return P2P_PREFIX+name.toLowerCase().replace(/[^a-z0-9]/g,"")
}
const p2p={peer:null,conns:new Map(),onMsg:null,onPresence:null,myName:null,ready:false,pending:[]}
function p2pInit(myName){
if(p2p.peer&&!p2p.peer.destroyed)return
p2p.myName=myName
p2p.ready=false
const peer=new Peer(p2pId(myName),{config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}})
p2p.peer=peer
peer.on("open",()=>{
p2p.ready=true
if(p2p.pending.length){p2pConnect(p2p.pending);p2p.pending=[]}
})
peer.on("connection",conn=>{
wireConn(conn)
})
peer.on("error",e=>{
if(e.type==="peer-unavailable")return
console.error("p2p error",e.type)
})
}
function wireConn(conn){
conn.on("open",()=>{
p2p.conns.set(conn.peer,conn)
if(p2p.onPresence)p2p.onPresence(p2pList())
})
conn.on("data",d=>{if(p2p.onMsg)p2p.onMsg(d)})
conn.on("close",()=>{p2p.conns.delete(conn.peer);if(p2p.onPresence)p2p.onPresence(p2pList())})
conn.on("error",()=>{p2p.conns.delete(conn.peer)})
}
function p2pConnect(names){
if(!p2p.peer)return
if(!p2p.ready){p2p.pending=Array.from(new Set(p2p.pending.concat(names)));return}
names.forEach(name=>{
if(!name||name.toLowerCase()===(p2p.myName||"").toLowerCase())return
const id=p2pId(name)
if(p2p.conns.has(id))return
try{
const conn=p2p.peer.connect(id,{reliable:true})
wireConn(conn)
}catch(e){}
})
}
function p2pBroadcast(payload){
const data=JSON.stringify(payload)
p2p.conns.forEach(conn=>{try{if(conn.open)conn.send(data)}catch(e){}})
}
function p2pList(){
return Array.from(p2p.conns.keys()).map(id=>id.slice(P2P_PREFIX.length))
}
function p2pCount(){
return p2p.conns.size
}
function p2pTeardown(){
p2p.conns.forEach(c=>{try{c.close()}catch(e){}})
p2p.conns.clear()
if(p2p.peer){try{p2p.peer.destroy()}catch(e){}}
p2p.peer=null
p2p.ready=false
p2p.pending=[]
}

async function puterReady(){
if(!window.puter)throw new Error("Puter.js failed to load. Check your connection and reload.")
}
async function isPuterSignedIn(){
await puterReady()
return puter.auth.isSignedIn()
}
async function puterSignIn(){
await puterReady()
await puter.auth.signIn()
return puter.auth.getUser()
}
async function puterSignOut(){
await puterReady()
puter.auth.signOut()
}
async function puterUser(){
await puterReady()
if(!puter.auth.isSignedIn())return null
return puter.auth.getUser()
}
async function kvGet(key,fallback){
await puterReady()
const v=await puter.kv.get(key)
if(v===null||v===undefined)return fallback
try{return JSON.parse(v)}catch(e){return fallback}
}
async function kvSet(key,value){
await puterReady()
return puter.kv.set(key,JSON.stringify(value))
}
async function kvDel(key){
await puterReady()
return puter.kv.del?puter.kv.del(key):puter.kv.delete(key)
}
async function getProfile(){
return kvGet("vael_profile",{displayName:"",bio:""})
}
async function saveProfile(p){
return kvSet("vael_profile",p)
}
async function getAvatar(){
return kvGet("vael_avatar",null)
}
async function saveAvatarFromFile(file){
const dataUrl=await resizeToDataUrl(file,128,128,0.82)
await kvSet("vael_avatar",dataUrl)
return dataUrl
}
function resizeToDataUrl(file,w,h,quality){
return new Promise((resolve,reject)=>{
const img=new Image()
const reader=new FileReader()
reader.onerror=()=>reject(new Error("Could not read that image"))
reader.onload=()=>{
img.onerror=()=>reject(new Error("Could not decode that image"))
img.onload=()=>{
const canvas=document.createElement("canvas")
canvas.width=w;canvas.height=h
const ctx=canvas.getContext("2d")
const scale=Math.max(w/img.width,h/img.height)
const sw=w/scale,sh=h/scale
const sx=(img.width-sw)/2,sy=(img.height-sh)/2
ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h)
resolve(canvas.toDataURL("image/jpeg",quality))
}
img.src=reader.result
}
reader.readAsDataURL(file)
})
}
async function getLink(){
return kvGet("vael_link",null)
}
async function saveLink(link){
return kvSet("vael_link",link)
}
async function clearLink(){
return kvDel("vael_link")
}
async function getPasskeyRecord(){
return kvGet("vael_passkey",null)
}
async function savePasskeyRecord(rec){
return kvSet("vael_passkey",rec)
}
async function clearPasskeyRecord(){
return kvDel("vael_passkey")
}

async function apiBase(){
return DEFAULT_API_BASE
}

async function getStatus(){return apiFetch("/api/status")}

function fileToBase64(file){
return new Promise((resolve,reject)=>{
const r=new FileReader()
r.onload=()=>resolve(r.result.split(",")[1])
r.onerror=reject
r.readAsDataURL(file)
})}
async function uploadImage(file){
const data=await fileToBase64(file)
return apiFetch("/api/upload",{method:"POST",body:JSON.stringify({type:file.type,data})})
}

const app=$("#app")
function linkify(text){
let t=esc(text)
t=t.replace(/```([^`]+)```/g,(m,c)=>"<code>"+c.replace(/\n/g,"<br>")+"</code>")
t=t.replace(/`([^`]+)`/g,(m,c)=>"<code>"+c+"</code>")
t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
t=t.replace(/\*([^*]+)\*/g,"<i>$1</i>")
t=t.replace(/(https?:\/\/[^\s<]+)/g,url=>`<a href="${url}" target="_blank" rel="noopener">${url}</a>`)
t=t.replace(/(^|\s)@([a-zA-Z0-9_]{2,20})/g,(m,pre,name)=>{
const known=state.players.concat(state.dms.map(d=>({name:d})))
const hit=known.find(k=>k.name&&k.name.toLowerCase()===name.toLowerCase())
return pre+(hit?`<b style="color:#b9a4dc">@${name}</b>`:"@"+name)})
return t
}
function timeFmt(ts){return new Date(ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function dayFmt(ts){return new Date(ts).toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})}
function sameDay(a,b){const x=new Date(a),y=new Date(b);return x.toDateString()===y.toDateString()}
function toast(msg){
let t=$(".toast")
if(!t){t=el("div","toast");document.body.append(t)}
t.textContent=msg
t.classList.add("show")
clearTimeout(t._h)
t._h=setTimeout(()=>t.classList.remove("show"),2600)
}

async function loadIdentity(){
try{
state.puterUser=await puterUser()
if(state.puterUser){
state.link=await getLink()
state.profile=await getProfile()
state.avatar=await getAvatar()
state.passkeyRecord=await getPasskeyRecord()
state.passkeyRequired=await getSetting("require_passkey_unlock",false)
}
}catch(e){console.error(e)}
}
document.addEventListener("DOMContentLoaded",boot)
function render(){
if(!state.puterUser){clearTimers();app.innerHTML="";renderGateSignIn();return}
if(!DEFAULT_API_BASE){clearTimers();app.innerHTML="";renderGateNoServer();return}
if(!state.link){clearTimers();app.innerHTML="";renderGateLink();return}
if(state.passkeyRequired&&state.passkeyRecord&&!state.unlocked){clearTimers();app.innerHTML="";renderGateUnlock();return}
if(!state.shellBuilt){app.innerHTML="";buildShell();state.shellBuilt=true;startStatusPoll()}
renderMain()
}

code.oninput=()=>{code.value=code.value.toUpperCase().replace(/[^A-Z0-9]/g,"");errEl.classList.add("hidden")}
async function submit(){
if(code.value.length<6)return
go.disabled=true;go.textContent="Linking..."
try{
const res=await redeemLink(code.value)
await saveLink({token:res.token,name:res.name,uuid:res.uuid})
state.link={token:res.token,name:res.name,uuid:res.uuid}
render()
}catch(e){
errEl.textContent=e.code==="invalid_or_expired_code"?"That code is wrong or expired. Run /vaellink again.":"Couldn't reach the server. Check your connection."
errEl.classList.remove("hidden")
go.disabled=false;go.textContent="Link account"
}}
go.onclick=submit
code.onkeydown=e=>{if(e.key==="Enter")submit()}
}
function currentRoute(){
const h=(location.hash.slice(1)||"").split("/").filter(Boolean)
if(h[0]==="home")return{name:"home"}
if(h[0]==="tickets")return{name:"tickets",type:h[1]||null}
if(h[0]==="voice"&&h[1])return{name:"voice",channel:h[1]}
if(h[0]==="c"&&h[1])return{name:"channel",channel:h[1]}
if(h[0]==="dm"&&h[1])return{name:"dm",withName:h[1]}
if(h[0]==="settings")return{name:"settings",tab:h[1]||"profile"}
return{name:"home"}
}

function wireSearch(){
const input=$("#searchbox"),panel=$("#searchpanel")
let t=null
input.oninput=()=>{
clearTimeout(t)
t=setTimeout(async()=>{
const q=input.value.trim()
if(!q){panel.classList.add("hidden");return}
const results=await searchMessages(q)
panel.innerHTML=results.length?results.map(m=>{
const isDmc=m.channel.startsWith("dm-")
const label=isDmc?otherFromDm(m.channel,state.link.name):("#"+(CHANNEL_META[m.channel]?CHANNEL_META[m.channel].label:m.channel))
return `<div class="searchresult" data-channel="${esc(m.channel)}" data-dm="${isDmc?1:0}"><b>${esc(label)}</b><small>${esc(m.authorName)}: ${esc(m.content.slice(0,80))}</small></div>`
}).join(""):`<div class="searchempty">No messages match "${esc(q)}"</div>`
panel.classList.remove("hidden")
panel.querySelectorAll(".searchresult").forEach(r=>r.onclick=()=>{
panel.classList.add("hidden");input.value=""
location.hash=r.dataset.dm==="1"?"#/dm/"+r.dataset.channel.replace(/^dm-/,"").split("-").find(n=>n.toLowerCase()!==state.link.name.toLowerCase())||otherFromDm(r.dataset.channel,state.link.name):"#/c/"+r.dataset.channel
})
},220)}
document.addEventListener("pointerdown",e=>{if(!e.target.closest(".tb-search"))panel.classList.add("hidden")})
}

function otherFromDm(dmId,me){

async function joinVoiceChannel(channelId){
const audioStream=await navigator.mediaDevices.getUserMedia({audio:true})
const peer=new Peer(voicePeerId(state.link.name),{config:{iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]}})
state.voice={channel:channelId,peer,audioTrack:audioStream.getAudioTracks()[0],videoTrack:null,mode:"none",calls:new Map(),tiles:new Map(),known:new Set(),nameById:new Map(),micOn:true,ready:false,pending:null}
await new Promise((resolve,reject)=>{
peer.on("open",resolve)
peer.on("error",e=>{if(!state.voice.ready)reject(e)})
})
state.voice.ready=true
peer.on("call",call=>{
const stream=currentOutgoingStream()
call.answer(stream)
const name=state.voice.nameById.get(call.peer)||call.peer.replace("vael-voice-","")
wireVoiceCall(call,name)
})
const others=await voiceJoin(channelId)
others.forEach(n=>{state.voice.known.add(n);state.voice.nameById.set(voicePeerId(n),n);callVoicePeer(n)})
state.voice.heartbeat=setInterval(async()=>{
if(!state.voice)return
try{
const list=await voiceJoin(channelId)
list.forEach(n=>{
state.voice.nameById.set(voicePeerId(n),n)
if(!state.voice.known.has(n)){state.voice.known.add(n);callVoicePeer(n)}})
}catch(e){}
},10000)
renderVoiceRoom($("#main"),channelId)
renderVoiceNav()
}
function currentOutgoingStream(){
const tracks=[state.voice.audioTrack]
if(state.voice.videoTrack)tracks.push(state.voice.videoTrack)
return new MediaStream(tracks)
}
function callVoicePeer(name){
if(!state.voice||state.voice.calls.has(name))return
try{
const call=state.voice.peer.call(voicePeerId(name),currentOutgoingStream())
wireVoiceCall(call,name)
}catch(e){}
}
function wireVoiceCall(call,name){
state.voice.calls.set(name,call)
call.on("stream",remoteStream=>{renderVoiceTile(name,remoteStream,false)})
call.on("close",()=>{state.voice.calls.delete(name);removeVoiceTile(name)})
call.on("error",()=>{state.voice.calls.delete(name);removeVoiceTile(name)})
}

function isNearBottom(){
const m=$("#msgs")
if(!m)return true
return m.scrollHeight-m.scrollTop-m.clientHeight<80
}
function scrollBottom(){

function detectEmbed(text){
let m
if((m=text.match(/https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/)))return{type:"youtube",url:m[0]}
if((m=text.match(/https?:\/\/(?:www\.|vm\.)?tiktok\.com\/[^\s]+/)))return{type:"tiktok",url:m[0]}
if((m=text.match(/https?:\/\/(?:www\.)?instagram\.com\/(?:p|reel)\/[^\s]+/)))return{type:"instagram",url:m[0]}
if((m=text.match(/https?:\/\/(?:www\.)?(?:discord\.gg|discord\.com\/invite)\/([\w-]+)/)))return{type:"discord",url:m[0],code:m[1]}
return null
}

for(const m of list){

lastDay=m.ts

const grouped=lastAuthor===m.authorName&&!m.replyTo
const attach=m.attachment?`<a href="${esc(m.attachment)}" target="_blank" rel="noopener" class="msgattach"><img src="${esc(m.attachment)}" loading="lazy"></a>`:""
const emb=detectEmbed(m.content||"")
const embedHtml=emb?`<div class="embedbox" id="embed-${m.id}"><div class="embedloading">Loading preview…</div></div>`:""
if(emb)embeds.push({id:m.id,...emb})

lastAuthor=m.authorName}

async function loadEmbed(e){
const box=document.getElementById("embed-"+e.id)
if(!box)return
if(e.type==="instagram"){
box.innerHTML=`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="embedcard row plain"><div class="embedicon">${ICONS.image}</div><div class="embedbody"><span class="embedkind">Instagram</span><small>Preview isn't available without an API key — tap to open</small></div></a>`
return}
try{
if(e.type==="youtube"){
const r=await fetch("https://www.youtube.com/oembed?format=json&url="+encodeURIComponent(e.url))
if(!r.ok)throw 0
const d=await r.json()
box.innerHTML=`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="embedcard"><img src="${esc(d.thumbnail_url)}" class="embedthumb"><div class="embedbody"><span class="embedkind">${ICONS.image} YouTube</span><b>${esc(d.title)}</b><small>${esc(d.author_name||"")}</small></div></a>`
return}
if(e.type==="tiktok"){
const r=await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(e.url))
if(!r.ok)throw 0
const d=await r.json()
box.innerHTML=`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="embedcard"><img src="${esc(d.thumbnail_url)}" class="embedthumb"><div class="embedbody"><span class="embedkind">${ICONS.star} TikTok</span><b>${esc(d.title||"")}</b><small>${esc(d.author_name||"")}</small></div></a>`
return}
if(e.type==="discord"){
const r=await fetch("https://discord.com/api/v10/invites/"+encodeURIComponent(e.code)+"?with_counts=true")
if(!r.ok)throw 0
const d=await r.json()
const icon=d.guild&&d.guild.icon?`https://cdn.discordapp.com/icons/${d.guild.id}/${d.guild.icon}.png`:null
box.innerHTML=`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="embedcard row"><div class="embedicon">${icon?`<img src="${icon}">`:ICONS.chat}</div><div class="embedbody"><span class="embedkind">Discord server</span><b>${esc(d.guild?d.guild.name:"Invite")}</b><small>${d.approximate_member_count?d.approximate_member_count+" members":""}</small></div></a>`
return}
throw 0
}catch(err){
const label=e.type==="youtube"?"YouTube":e.type==="tiktok"?"TikTok":"Discord"
box.innerHTML=`<a href="${esc(e.url)}" target="_blank" rel="noopener" class="embedcard row plain"><div class="embedicon">${ICONS.send}</div><div class="embedbody"><span class="embedkind">${label}</span><small>${esc(e.url)}</small></div></a>`
}}

preview.innerHTML=`<div class="stagedimg"><img src="${stagedPreviewUrl}"><button id="unstagebtn">${ICONS.x}</button></div>`
$("#unstagebtn").onclick=()=>{URL.revokeObjectURL(stagedPreviewUrl);stagedFile=null;preview.innerHTML="";attachInput.value=""}}
async function doSend(){
const content=ta.value.trim()
if(!content&&!stagedFile)return
const replyTo=replyTarget?replyTarget.id:null
const fileToSend=stagedFile
ta.value="";ta.style.height="auto";setDraft(channel,"")
replyTarget=null;renderReplyBar()
stagedFile=null;preview.innerHTML=""
if(!navigator.onLine||state.p2pActive){
const localId=await queueOutbox(channel,content,replyTo)
const msg={id:"p2p-"+localId,ts:Date.now(),authorName:state.link.name,authorUuid:state.link.uuid||"",content,replyTo,edited:false,reactions:{}}
if(state.p2pActive){
await cacheMessages(channel,[msg])
renderMessages(await getCachedMessages(channel,300),channel)
scrollBottom()
p2pBroadcast({type:"msg",channel,id:msg.id,ts:msg.ts,authorName:msg.authorName,authorUuid:msg.authorUuid,content,replyTo})
}else{
appendPendingMessage(channel,{content,replyTo,ts:Date.now()})
}
return}
send.disabled=true
try{
let attachment=null
if(fileToSend){
send.innerHTML=`<span class="spin"></span>`
const up=await uploadImage(fileToSend)
attachment=(await apiBase())+up.url}
const msg=await postMessage(channel,content||"",replyTo,attachment)
await cacheMessages(channel,[msg])
renderMessages(await getCachedMessages(channel,300),channel)
scrollBottom()
}catch(e){
if(e.code==="muted"){$("#mutedline").classList.remove("hidden")}
else{await queueOutbox(channel,content,replyTo);appendPendingMessage(channel,{content,replyTo,ts:Date.now()});toast(e.code==="file_too_large"?"That image is too big to upload.":"Couldn't send. It'll retry when you're back online.")}
}
send.disabled=false
send.innerHTML=ICONS.send}
}

<div class="rowitem"><div class="rt"><b>${esc(state.link.name)}</b><small>Linked Minecraft account</small></div><span class="tag ok">Linked</span></div>
<button class="btn sec" id="unlink" style="width:auto;padding:8px 14px;margin-top:10px">Forget link on this device</button>`
$("#avbtn").onclick=()=>$("#avfile").click()
$("#avfile").onchange=async e=>{
const f=e.target.files[0]
if(!f)return
try{const url=await saveAvatarFromFile(f);state.avatar=url;$("#avprev").src=url;renderProfileButton();toast("Avatar updated")}
catch(err){toast(err.message||"Couldn't use that image")}}
$("#savep").onclick=async()=>{
state.profile={displayName:$("#dname").value.trim(),bio:$("#dbio").value.trim()}
await saveProfile(state.profile)
renderProfileButton()
toast("Profile saved")}
$("#unlink").onclick=async()=>{
await clearLink()
state.link=null
state.shellBuilt=false
render()}
}
function settingsPasskeys(pane){
const has=!!state.passkeyRecord
pane.innerHTML=`<h2>Passkeys</h2><p class="sub">A passkey lets you lock Vael on this device behind your device's own fingerprint, face, or PIN. It doesn't replace your Puter sign-in — it's a local screen lock stored only on this device.</p>
<div class="rowitem"><div class="rt"><b>Device passkey</b><small>${has?"Set up on this device":"Not set up"}</small></div>${has?`<button class="btn sec" id="rmpk" style="width:auto;padding:7px 12px">Remove</button>`:`<button class="btn pri" id="addpk" style="width:auto;padding:7px 12px">Set up</button>`}</div>
${has?`<div class="toggle"><div><b>Require it to open Vael</b><small>Asks for your passkey every time you open this site</small></div><button class="switch${state.passkeyRequired?" on":""}" id="reqpk"><i></i></button></div>`:""}`
if($("#addpk"))$("#addpk").onclick=async()=>{
try{
const rec=await registerPasskey(state.link.name)
await savePasskeyRecord(rec)
state.passkeyRecord=rec
toast("Passkey saved")
renderSettings($("#main")||pane.closest(".main"),"passkeys")
settingsPasskeys(pane)
}catch(e){toast(e.message||"Couldn't set up a passkey")}}
if($("#rmpk"))$("#rmpk").onclick=async()=>{
await clearPasskeyRecord()
await setSetting("require_passkey_unlock",false)
state.passkeyRecord=null;state.passkeyRequired=false
settingsPasskeys(pane)}
if($("#reqpk"))$("#reqpk").onclick=async()=>{
state.passkeyRequired=!state.passkeyRequired
await setSetting("require_passkey_unlock",state.passkeyRequired)
settingsPasskeys(pane)}
}
function settingsNotifications(pane){
getSetting("notify_mentions",true).then(on=>{
pane.innerHTML=`<h2>Notifications</h2><p class="sub">Desktop notifications only fire while this tab is in the background.</p>
<div class="toggle"><div><b>Notify on mentions</b><small>When someone @s you in a channel or sends a DM</small></div><button class="switch${on?" on":""}" id="notif"><i></i></button></div>`
$("#notif").onclick=async()=>{
const next=!on
if(next&&window.Notification&&Notification.permission!=="granted")await Notification.requestPermission()
await setSetting("notify_mentions",next)
settingsNotifications(pane)}
})
}
function settingsPrivacy(pane){
listBlocks().then(blocks=>{
pane.innerHTML=`<h2>Privacy</h2><p class="sub">Blocked players' messages are hidden from you in this browser only.</p>
<div class="field"><label>Block a player</label><input id="blockname" placeholder="Minecraft username"></div>
<button class="btn sec" id="blockbtn" style="width:auto;padding:8px 14px">Block</button>
<div class="hr"></div>
${blocks.length?blocks.map(b=>`<div class="rowitem"><div class="rt">${esc(b.name)}</div><button data-un="${esc(b.name)}" class="btn sec" style="width:auto;padding:6px 10px">Unblock</button></div>`).join(""):`<p class="sub">Nobody's blocked.</p>`}`
$("#blockbtn").onclick=async()=>{
const n=$("#blockname").value.trim()
if(!n)return
await toggleBlock(n)
settingsPrivacy(pane)}
pane.querySelectorAll("[data-un]").forEach(b=>b.onclick=async()=>{await toggleBlock(b.dataset.un);settingsPrivacy(pane)})
})
}
function settingsData(pane){
pane.innerHTML=`<h2>Local data</h2><p class="sub">Messages are cached on this device so Vael opens instantly.</p><div id="usage" class="sub">Checking usage...</div><button class="btn dan" id="clearcache" style="width:auto;padding:9px 16px">Clear local cache</button>`
if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{
$("#usage").textContent=`Using about ${(e.usage/1048576).toFixed(1)} MB of ${(e.quota/1048576/1024).toFixed(1)} GB available.`})
$("#clearcache").onclick=async()=>{
await db.messages.clear();await db.outbox.clear();await db.drafts.clear()
toast("Local cache cleared")}
}
function settingsStaff(pane){
pane.innerHTML=`<h2>Staff tools</h2><p class="sub">Moderation actions for VaelKits staff.</p>
<h3 style="font-size:15px;margin-bottom:10px">Mute</h3>
<div class="fields" style="margin-bottom:10px"><div class="fld"><label>Player</label><input id="muten" placeholder="Username"></div><div class="fld"><label>Minutes</label><input id="mutem" value="15" type="number"></div></div>
<button class="btn dan" id="mutebtn" style="width:auto;padding:9px 16px">Mute</button>
<div id="muteslist" class="sub" style="margin-top:14px">Loading active mutes...</div>
<div class="hr"></div>
<h3 style="font-size:15px;margin-bottom:10px">Kick from server</h3>
<div class="fields" style="margin-bottom:10px"><div class="fld"><label>Player</label><input id="kickn" placeholder="Username"></div><div class="fld"><label>Reason</label><input id="kickr" placeholder="Optional"></div></div>
<button class="btn dan" id="kickbtn" style="width:auto;padding:9px 16px">Kick</button>
<div class="hr"></div>
<h3 style="font-size:15px;margin-bottom:10px">Unlink account</h3>
<p class="sub" style="margin-bottom:10px">Forces someone to re-run /vaellink to use Vael again.</p>
<div class="field"><label>Player</label><input id="unlinkn" placeholder="Username"></div>
<button class="btn dan" id="unlinkbtn" style="width:auto;padding:9px 16px">Unlink</button>
<div class="hr"></div>
<h3 style="font-size:15px;margin-bottom:10px">Clear a channel</h3>
<p class="sub" style="margin-bottom:10px">Deletes every message in a channel. Pinned messages are kept.</p>
<div class="field"><label>Channel</label><select id="clearch">${state.channels.map(c=>`<option value="${c.name}">${esc((CHANNEL_META[c.name]||{label:c.name}).label)}</option>`).join("")}</select></div>
<button class="btn dan" id="clearbtn" style="width:auto;padding:9px 16px">Clear channel</button>
<div class="hr"></div>
<div style="display:flex;align-items:center;margin-bottom:10px"><h3 style="font-size:15px;flex:1">Reports</h3><button class="btn sec" id="toggleall" style="width:auto;padding:6px 12px;font-size:13px">Show resolved</button></div>
<div id="reportlist" class="sub">Loading...</div>
<div class="hr"></div>
<h3 style="font-size:15px;margin-bottom:6px">Possible alt accounts</h3>
<p class="sub" style="margin-bottom:10px">Groups of accounts that have joined from the same connection. Shared wifi or a phone hotspot can trigger this too — use judgment.</p>
<div id="altlist" class="sub">Loading...</div>`
$("#mutebtn").onclick=async()=>{
const n=$("#muten").value.trim()
if(!n)return
try{await muteUser(n,parseInt($("#mutem").value||"15",10));toast("Muted "+n);$("#muten").value="";loadMutes()}
catch(e){toast("Couldn't mute")}}
$("#kickbtn").onclick=async()=>{
const n=$("#kickn").value.trim()
if(!n)return
try{await kickPlayer(n,$("#kickr").value.trim()||undefined);toast("Kicked "+n);$("#kickn").value="";$("#kickr").value=""}
catch(e){toast("Couldn't kick")}}
$("#unlinkbtn").onclick=async()=>{
const n=$("#unlinkn").value.trim()
if(!n)return
if(!confirm("Unlink "+n+"? They'll need to run /vaellink again."))return
try{await unlinkUser(n);toast("Unlinked "+n);$("#unlinkn").value=""}
catch(e){toast("Couldn't unlink")}}
$("#clearbtn").onclick=async()=>{
const ch=$("#clearch").value
if(!confirm("Clear all messages in #"+ch+"? This can't be undone."))return
try{await clearChannel(ch);await db.messages.where("channel").equals(ch).delete();toast("Cleared #"+ch)}
catch(e){toast("Couldn't clear channel")}}
let showAll=false
function loadReports(){
$("#reportlist").textContent="Loading..."
getReports(showAll).then(list=>{
const r=list.slice(-40).reverse()
$("#reportlist").innerHTML=r.length?r.map(x=>`<div class="rowitem"><div class="rt"><b>#${esc(x.channel)}</b>${x.resolved?' <span class="tag ok">Resolved</span>':""}<small>reported by ${esc(x.reporter)} · ${esc(x.reason||"")}</small></div>${x.resolved?"":`<button data-rid="${esc(x.id)}" class="btn sec" style="width:auto;padding:6px 10px">Resolve</button>`}</div>`).join(""):"Nothing here."
$("#reportlist").querySelectorAll("[data-rid]").forEach(b=>b.onclick=async()=>{await resolveReport(b.dataset.rid);loadReports()})
}).catch(()=>{$("#reportlist").textContent="Couldn't load reports."})}
$("#toggleall").onclick=()=>{showAll=!showAll;$("#toggleall").textContent=showAll?"Show unresolved":"Show resolved";loadReports()}
function loadMutes(){
getMutes().then(list=>{
$("#muteslist").innerHTML=list.length?list.map(m=>`<div class="rowitem"><div class="rt"><b>${esc(m.name)}</b><small>${m.remainingMinutes} min left</small></div><button data-un="${esc(m.name)}" class="btn sec" style="width:auto;padding:6px 10px">Unmute</button></div>`).join(""):`<div class="sub">Nobody's muted right now.</div>`
$("#muteslist").querySelectorAll("[data-un]").forEach(b=>b.onclick=async()=>{await unmuteUser(b.dataset.un);loadMutes()})
}).catch(()=>{$("#muteslist").textContent="Couldn't load mutes."})}
loadMutes()
loadReports()
getAltClusters().then(clusters=>{
$("#altlist").innerHTML=clusters.length?clusters.map(names=>`<div class="rowitem"><div class="rt">${names.map(n=>esc(n)).join(" <span style=\"color:var(--dim2)\">·</span> ")}</div></div>`).join(""):`<div class="sub">No overlapping connections spotted.</div>`
}).catch(()=>{$("#altlist").textContent="Couldn't load."})
}

</script>
</body>
</html>
